<svg xmlns="http://www.w3.org/2000/svg" width="940" height="290" viewBox="0 0 940 290" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a GSTIN</title>
  <desc id="d">A GSTIN is a 2 digit state code, a 10 character PAN, an entity number, the letter Z and a check digit.</desc>
  <rect width="940" height="290" rx="18" fill="#0f172a"/>
  <rect x="1" y="1" width="938" height="288" rx="17" fill="none" stroke="#334155" stroke-width="2"/>
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="470.0" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Anatomy of a GSTIN</text>
    <text x="470.0" y="272" text-anchor="middle" font-size="12.5" fill="#64748b">Example number for illustration only</text>
        <path d="M43.0 144 v8 H141.0 v-8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="92.0" y1="152" x2="92.0" y2="168" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="92.0" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#38bdf8">State code</text>
    <text x="92.0" y="209" text-anchor="middle" font-size="12.5" fill="#94a3b8">2 digits</text>
    <path d="M167.0 144 v8 H681.0 v-8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="424.0" y1="152" x2="424.0" y2="168" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <text x="424.0" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#a78bfa">PAN</text>
    <text x="424.0" y="209" text-anchor="middle" font-size="12.5" fill="#94a3b8">10 characters  ·  AAAAA9999A</text>
    <path d="M707.0 144 v8 H753.0 v-8" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="730.0" y1="152" x2="730.0" y2="168" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <text x="730.0" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#fbbf24">Entity no.</text>
    <text x="730.0" y="209" text-anchor="middle" font-size="12.5" fill="#94a3b8">1–9, A–Z</text>
    <path d="M779.0 144 v8 H825.0 v-8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="802.0" y1="152" x2="802.0" y2="168" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="802.0" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#94a3b8">Fixed</text>
    <text x="802.0" y="209" text-anchor="middle" font-size="12.5" fill="#94a3b8">always Z</text>
    <path d="M851.0 144 v8 H897.0 v-8" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="874.0" y1="152" x2="874.0" y2="168" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <text x="874.0" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#34d399">Check digit</text>
    <text x="874.0" y="209" text-anchor="middle" font-size="12.5" fill="#94a3b8">mod-36</text>
  </g>
